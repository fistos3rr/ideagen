name: Development

on:
  push:
    branches:
      - dev

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - name: Run dev server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
              set -e
              cd /home/work/Projects/golang/ideagen
              make git/pull
              #make docker/rebuild
              #sudo systemctl restart ideagen
              #sudo systemctl status ideagen --no-pager
