      security:
      - BearerAuth: []
      summary: Create user-idea bound
      tags:
      - service
  /types:
    get:
      description: Get all types pages with filters
      parameters:
      - description: Type name
        in: query
        name: name
        type: string
      - description: Active only
        in: query
        name: active_only
        type: boolean
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: page_size
        type: integer
      - description: Sort by
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TypeListResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Not enough privilleges
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "422":
          description: Validation failed
          schema:
            $ref: '#/definitions/dto.ValidationErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get Type list
      tags:
      - types
    post:
      consumes:
      - application/json
      description: Create Type for Ideas
      parameters:
      - description: Type data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.TypeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Type created
          headers:
            Location:
              description: 'URL of created resource, for example: /v1/types/42'
              type: string
          schema:
            $ref: '#/definitions/dto.TypeResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Not enough privilleges
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "422":
          description: Validation failed
          schema:
            $ref: '#/definitions/dto.ValidationErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
